#!/usr/bin/env bash

# ==============================================================================
# Project     : TuxArmor
# File        : config/audit.conf
# Description : Global configurations, thresholds, and execution settings.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Application & Log Settings
# ------------------------------------------------------------------------------
readonly APP_NAME="TuxArmor"
readonly APP_VERSION="1.0.0"
readonly LOG_DIR="/var/log/tuxArmor"
readonly REPORT_TXT="${LOG_DIR}/tuxArmor-report.log"
readonly REPORT_JSON="${LOG_DIR}/tuxArmor-report$(date +"%Y-%m-%dT%H:%M:%SZ").json"

# ------------------------------------------------------------------------------
# 2. Terminal Colors
# ------------------------------------------------------------------------------
readonly COLOR_RED='\033[0;31m'
readonly COLOR_GREEN='\033[0;32m'
readonly COLOR_YELLOW='\033[1;33m'
readonly COLOR_BLUE='\033[0;34m'
readonly NC='\033[0m'

# ------------------------------------------------------------------------------
# 3. Security Baselines
# ------------------------------------------------------------------------------
readonly PASS_MIN_LEN=12
readonly PASS_MAX_DAYS=90
readonly SSH_PORT=22

# ------------------------------------------------------------------------------
# 4. File Permissions Baseline (Associative Array)
# ------------------------------------------------------------------------------
declare -A FILE_PERMS_BASELINE=(
    ["/etc/shadow"]="0000 root root"
    ["/etc/gshadow"]="0000 root root"
    ["/etc/passwd"]="0644 root root"
    ["/etc/group"]="0644 root root"
    ["/etc/sudoers"]="0440 root root"
)

# ------------------------------------------------------------------------------
# 5. SUID Whitelist
# ------------------------------------------------------------------------------
SUID_WHITELIST=(
    "/usr/bin/passwd"
    "/usr/bin/sudo"
    "/usr/bin/newgrp"
    "/usr/bin/chfn"
    "/usr/bin/chsh"
    "/usr/bin/gpasswd"
    "/usr/bin/umount"
    "/usr/bin/mount"
    "/usr/bin/su"
)